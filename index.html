<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ⚠️ DE SCHIMBAT DUPĂ DEPLOY: înlocuiește https://your-domain.com cu adresa
         reală, în toate cele patru locuri de mai jos (canonical, og:url, og:image,
         twitter:image). Facebook, LinkedIn și X cer adrese absolute pentru
         imaginea de previzualizare — cu una relativă nu afișează nimic. -->

    <title>Stoian Andrei — Frontend Developer</title>
    <meta
      name="description"
      content="Frontend &amp; mobile developer in Bucharest. React Native, TypeScript and Python — from the Figma file to the shipped screen."
    />
    <meta name="author" content="Stoian Andrei" />
    <meta name="theme-color" content="#F2F2F2" />
    <link rel="canonical" href="https://your-domain.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph — Facebook, LinkedIn, Slack, Discord, WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stoian Andrei" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Stoian Andrei — Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend &amp; mobile developer in Bucharest. React Native, TypeScript and Python — from the Figma file to the shipped screen."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stoian Andrei — Frontend Developer" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stoian Andrei — Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend &amp; mobile developer in Bucharest. React Native, TypeScript and Python — from the Figma file to the shipped screen."
    />
    <meta name="twitter:image" content="https://your-domain.com/og.jpg" />
    <meta name="twitter:image:alt" content="Stoian Andrei — Frontend Developer" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
