    <!-- Adresa apare în patru locuri: canonical, og:url, og:image, twitter:image.

         relativă. Dacă legi un domeniu propriu în Vercel, schimbă-le pe toate. -->

    <title>Stoian Andrei — Frontend Developer</title>
    <meta
      name="description"
      content="Frontend &amp; mobile developer in Bucharest. React Native, TypeScript and Python — from the Figma file to the shipped screen."
    />

    <meta name="theme-color" content="#F2F2F2" />
    <link rel="canonical" href="https://portfolio-gamma-ten-db2cnhhcxq.vercel.app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stoian Andrei" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Stoian Andrei — Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend &amp; mobile developer in Bucharest. React Native, TypeScript and Python — from the Figma file to the shipped screen."

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stoian Andrei — Frontend Developer" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stoian Andrei — Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend &amp; mobile developer in Bucharest. React Native, TypeScript and Python — from the Figma file to the shipped screen."
    />
